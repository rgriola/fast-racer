<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Racer</title>
    <link rel="stylesheet" href="./css/race-day.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div id="race-timer" class="race-timer">00:00.00</div>
                <h1 class="game-title">Fast Racer</h1>
            </div>
        </header>
        <nav>
        </nav>
        <main> 
            <aside>
                <div id="Leaderboard">
                    <h2>Leaderboard</h2>
                    <div id="leaderboard-list">
                        <div class="leaderboard-header">
                            <div class="header-item">PL</div>
                            <div class="header-item">Racer</div>
                            <div class="header-item">No.</div>
                            <div class="header-item">LAP</div>
                            <div class="header-item">MPH</div>
                        </div>
                        <!-- Predefined placeholders for all 20 positions -->
                        <div id="place-1"></div>
                        <div id="place-2"></div>
                        <div id="place-3"></div>
                        <div id="place-4"></div>
                        <div id="place-5"></div>
                        <div id="place-6"></div>
                        <div id="place-7"></div>
                        <div id="place-8"></div>
                        <div id="place-9"></div>
                        <div id="place-10"></div>
                        <div id="place-11"></div>
                        <div id="place-12"></div>
                        <div id="place-13"></div>
                        <div id="place-14"></div>
                        <div id="place-15"></div>
                        <div id="place-16"></div>
                        <div id="place-17"></div>
                        <div id="place-18"></div>
                        <div id="place-19"></div>
                        <div id="place-20"></div>
                    </div>
                </div>
            </aside>
            <section>
                    <div class="race-track"><div>
                        <div class="controls">
                            <button id="start-button" class="game-button">Start Race</button>
                            <button id="pause-button" class="game-button" disabled>Pause</button>
                        </div>
                    <canvas id="gameCanvas" width="800" height="400"></canvas>
                    </div>
            
            </section>
            <div class="clear"></div>
        </main>
        <footer></footer>
    </div> <!--container-->
    <script>
     
    // Security and initialization function
    window.onload = function() {
        // Security checks
        const playerName = localStorage.getItem('playerName');
        const playerCarNumber = localStorage.getItem('playerCarNumber');
        
        if (!playerName || !playerCarNumber) {
            alert('You must enter your name and car number on the landing page first!');
            window.location.href = 'index.html';
            return;
        }

        // Initialize player display
        const playerNameDisplay = document.getElementById('player-name-display');
        if (playerNameDisplay) {
            playerNameDisplay.textContent = `Racer: ${playerName} (#${playerCarNumber})`;
        }
    };
    </script>
    <script type="module" src="./dist/main.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Racer</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script>
        function validateAndStartRace() {
            const playerName = document.getElementById('player-name').value.trim().toUpperCase();
            const carNumber = document.getElementById('car-number').value.trim();
            const carColor = document.getElementById('car-color').value; // Get selected color

    // Updated regex to allow spaces and more characters
    const nameRegex = /^[A-Z0-9\s]{1,12}$/; // Allows uppercase letters, numbers, and spaces
    const numberRegex = /^[0-9]{1,2}$/;     // Only numbers (0-99) for car number

    if (!nameRegex.test(playerName)) {
        alert('Please enter a valid name (up to 12 characters, letters and numbers only).');
        return;
    }

    if (!numberRegex.test(carNumber)) {
        alert('Please enter a valid car number (0-99).');
        return;
    }

    // Store all player data
    localStorage.setItem('playerName', playerName);
    localStorage.setItem('playerCarNumber', carNumber);
    localStorage.setItem('playerCarColor', carColor); // Store color
    
    window.location.href = 'race-day.html';
}
        function updatePreview() {
            const playerName = document.getElementById('player-name').value.trim().toUpperCase();
            const carNumber = document.getElementById('car-number').value.trim();
            const carColor = document.getElementById('car-color').value;

            // This live-populates as the player types their name.
            const title = document.getElementById('title');
            title.textContent = playerName ? `${playerName}'s Fast Racer` : 'Fast Racer';

            // Update the car preview
            const carDisplay = document.getElementById('car-display');
            const carNumberDisplay = document.getElementById('car-number-display');
            carDisplay.style.backgroundColor = carColor;
            carNumberDisplay.textContent = carNumber || '';
        }
    </script>
</head>
<body>
    <h1 id="title">Fast Racer</h1>
    <div class="inputbox">
        <label for="player-name">Fast Racer Name:</label>
        <input type="text" id="player-name" placeholder="Be Creative" 
        maxlength="12"
        oninput="updatePreview()" />
    </div>
<div class="inputbox">
    <label for="car-number">Racer Number:</label>
    <input type="text" id="car-number" placeholder="0 to 99" maxlength="2" oninput="updatePreview()" />
</div>
<div class="inputbox">
    <label for="car-color">Racer Color:</label>
    <input type="color" id="car-color" value="#ff0000" onchange="updatePreview()" />
</div>
    <div class="inputbox" id="car-preview">
        <div id="car-display">
            <span id="car-number-display"></span>
        </div>
    </div>
    <button onclick="validateAndStartRace()">Start Race</button>
</body>
</html>
